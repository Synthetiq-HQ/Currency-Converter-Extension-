name: Validate extension
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: for file in *.js; do node --check "$file"; done
      - name: Run regression checks
        run: node --test tests/*.test.js
      - name: Check optional proxy helper
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p '*_test.py'
      - name: Validate and package
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: QuickCurrency
          path: dist/*
